<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 590" width="1320" height="590" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">DriverLens: the three-agent pipeline</title>
  <desc id="d">A YouTube comment goes through Agent 1 (Theory of Mind), Agent 2 (Domain expert) and Agent 3 (Response) and produces a hidden concern, a churn risk, an action and a message. A shared memory feeds the three agents.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#15171b"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a6f78"/>
    </marker>
  </defs>

  <!-- background (solid, so it reads well in light and dark themes) -->
  <rect x="1" y="1" width="1318" height="588" rx="18" fill="#ffffff" stroke="#e4e4de" stroke-width="2"/>

  <text x="40" y="54" font-size="24" font-weight="700" fill="#15171b">DriverLens: three agents, one decision per comment</text>
  <text x="40" y="80" font-size="14" fill="#6a6f78">Each YouTube comment goes through the three agents. The memory is built from earlier comments.</text>

  <!-- input -->
  <rect x="40" y="180" width="170" height="150" rx="14" fill="#15171b"/>
  <text x="125" y="232" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">YouTube comment</text>
  <text x="125" y="264" font-size="13" fill="#d9d9d2" text-anchor="middle">+ car model</text>
  <text x="125" y="286" font-size="13" fill="#d9d9d2" text-anchor="middle">+ video context</text>

  <!-- flow arrows -->
  <line x1="212" y1="255" x2="251" y2="255" stroke="#15171b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="507" y1="255" x2="546" y2="255" stroke="#15171b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="802" y1="255" x2="841" y2="255" stroke="#15171b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1097" y1="255" x2="1136" y2="255" stroke="#15171b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Agent 1 -->
  <rect x="255" y="130" width="250" height="250" rx="14" fill="#ffffff" stroke="#d9d9d2" stroke-width="1.5"/>
  <rect x="255" y="130" width="250" height="48" rx="14" fill="#ffcc33"/>
  <rect x="255" y="158" width="250" height="20" fill="#ffcc33"/>
  <circle cx="283" cy="154" r="15" fill="#15171b"/>
  <text x="283" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="309" y="160" font-size="16" font-weight="700" fill="#15171b">Theory of Mind</text>
  <text x="275" y="207" font-size="13" fill="#15171b">Looks for the hidden feeling</text>
  <text x="275" y="228" font-size="13" fill="#15171b">behind the words:</text>
  <text x="275" y="256" font-size="13" fill="#15171b">• several candidate hypotheses</text>
  <text x="275" y="277" font-size="13" fill="#15171b">• plus a “nothing hidden” one</text>
  <text x="275" y="298" font-size="13" fill="#6a6f78">(most comments hide nothing)</text>
  <rect x="271" y="336" width="218" height="30" rx="15" fill="#fff4cc" stroke="#ffcc33"/>
  <text x="380" y="356" font-size="13" font-weight="700" fill="#15171b" text-anchor="middle">→ Candidate hypotheses</text>

  <!-- Agent 2 -->
  <rect x="550" y="130" width="250" height="250" rx="14" fill="#ffffff" stroke="#d9d9d2" stroke-width="1.5"/>
  <rect x="550" y="130" width="250" height="48" rx="14" fill="#ffcc33"/>
  <rect x="550" y="158" width="250" height="20" fill="#ffcc33"/>
  <circle cx="578" cy="154" r="15" fill="#15171b"/>
  <text x="578" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="604" y="160" font-size="16" font-weight="700" fill="#15171b">Domain expert</text>
  <text x="570" y="207" font-size="13" fill="#15171b">Checks each hypothesis against</text>
  <text x="570" y="228" font-size="13" fill="#15171b">French rules and habits:</text>
  <text x="570" y="256" font-size="13" fill="#15171b">• irony, GDPR, no pressure</text>
  <text x="570" y="277" font-size="13" fill="#15171b">• rejects invented labels</text>
  <text x="570" y="298" font-size="13" fill="#15171b">Picks the best with a score</text>
  <rect x="566" y="336" width="218" height="30" rx="15" fill="#fff4cc" stroke="#ffcc33"/>
  <text x="675" y="356" font-size="13" font-weight="700" fill="#15171b" text-anchor="middle">→ Selected hypothesis</text>

  <!-- Agent 3 -->
  <rect x="845" y="130" width="250" height="250" rx="14" fill="#ffffff" stroke="#d9d9d2" stroke-width="1.5"/>
  <rect x="845" y="130" width="250" height="48" rx="14" fill="#ffcc33"/>
  <rect x="845" y="158" width="250" height="20" fill="#ffcc33"/>
  <circle cx="873" cy="154" r="15" fill="#15171b"/>
  <text x="873" y="160" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="899" y="160" font-size="16" font-weight="700" fill="#15171b">Response</text>
  <text x="865" y="207" font-size="13" fill="#15171b">Turns it into a decision:</text>
  <text x="865" y="235" font-size="13" fill="#15171b">• the lightest fitting action</text>
  <text x="865" y="256" font-size="13" fill="#15171b">• churn risk (low to high)</text>
  <text x="865" y="277" font-size="13" fill="#15171b">• a drafted message</text>
  <text x="865" y="298" font-size="13" fill="#6a6f78">Self-check, revised if needed</text>
  <rect x="861" y="336" width="218" height="30" rx="15" fill="#fff4cc" stroke="#ffcc33"/>
  <text x="970" y="356" font-size="13" font-weight="700" fill="#15171b" text-anchor="middle">→ Action · risk · message</text>

  <!-- result -->
  <rect x="1140" y="180" width="140" height="150" rx="14" fill="#15171b"/>
  <text x="1210" y="214" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Result</text>
  <text x="1210" y="244" font-size="13" fill="#d9d9d2" text-anchor="middle">Hidden concern</text>
  <text x="1210" y="266" font-size="13" fill="#d9d9d2" text-anchor="middle">Churn risk</text>
  <text x="1210" y="288" font-size="13" fill="#d9d9d2" text-anchor="middle">Action + message</text>
  <text x="1210" y="314" font-size="12" font-weight="700" fill="#ffcc33" text-anchor="middle">→ Dashboard</text>

  <!-- shared memory -->
  <line x1="380" y1="448" x2="380" y2="386" stroke="#6a6f78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="675" y1="448" x2="675" y2="386" stroke="#6a6f78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="970" y1="448" x2="970" y2="386" stroke="#6a6f78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="390" y="424" font-size="12" fill="#6a6f78">context</text>
  <text x="685" y="424" font-size="12" fill="#6a6f78">context + prior probability</text>
  <text x="980" y="424" font-size="12" fill="#6a6f78">context</text>

  <rect x="255" y="450" width="840" height="100" rx="14" fill="#f4f4f0" stroke="#9aa0a9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="675" y="485" font-size="16" font-weight="700" fill="#15171b" text-anchor="middle">Shared memory</text>
  <text x="675" y="509" font-size="13" fill="#15171b" text-anchor="middle">Built from the 60% memory-building comments. Nothing is trained: it only counts earlier answers.</text>
  <text x="675" y="531" font-size="13" fill="#6a6f78" text-anchor="middle">Used as context by every agent, and as the prior probability of each hypothesis by Agent 2.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
